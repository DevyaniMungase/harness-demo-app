apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: harness-demo
  template:
    metadata:
      labels:
        app: harness-demo
    spec:
      containers:
        - name: harness-demo
          image: yourdockerusername/harness-demo:latest
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: harness-demo-service
spec:
  type: NodePort
  selector:
    app: harness-demo
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
